name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        # Severity is capped at "error" on purpose: env.site.sh, config/varsets.sh
        # and scripts/*.sh are designed to be sourced into each other rather than
        # run standalone, which makes shellcheck flag plenty of info/warning-level
        # false positives (SC1091 "can't follow non-constant source", SC2034
        # "appears unused") that aren't real bugs here. Real correctness issues
        # (undefined variables, syntax errors, ...) are still "error" severity and
        # will fail this job.
        run: |
          shellcheck -S error \
            scripts/run_out_generic.sh \
            scripts/run_cp_generic.sh \
            scripts/run_Analysis_v2.sh \
            scripts/report_walltimes.sh \
            config/varsets.sh \
            config/lint_varsets.sh \
            env.site.sh.example \
            submit.sh

  lint-varsets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run config/lint_varsets.sh
        # Static consistency check for config/varsets.sh: catches dangling
        # NEXT[]/CP_EXTRA[] references, VARSETS[] entries missing TIME[], and
        # VARSETS[] entries whose program/variable has no matching file under
        # f90_src/ or header/. See config/lint_varsets.sh for the full rule set.
        run: config/lint_varsets.sh
