name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        # Severity is capped at "error" on purpose: env.site.sh, config/varsets.sh
        # and scripts/*.sh are designed to be sourced into each other rather than
        # run standalone, which makes shellcheck flag plenty of info/warning-level
        # false positives (SC1091 "can't follow non-constant source", SC2034
        # "appears unused") that aren't real bugs here. Real correctness issues
        # (undefined variables, syntax errors, ...) are still "error" severity and
        # will fail this job.
        run: |
          shellcheck -S error \
            scripts/run_out_generic.sh \
            scripts/run_cp_generic.sh \
            scripts/run_analysis.sh \
            scripts/load_experiment.sh \
            experiments/*/*.sh \
            config/varsets.sh \
            config/varsets_chain.sh \
            config/varsets_single.sh \
            env.site.sh.example \
            submit.sh \
            tools/report_walltimes.sh \
            tools/merge_soil_monthly.sh \
            tools/check_and_found_var.sh \
            tools/check_archive.sh \
            tools/ncrepack-cordex \
            tools/lint_varsets.sh

      - name: Check config/varsets.sh (lint_varsets.sh)
        # Fails if a varset, NEXT/CP_EXTRA entry, program or header is missing.
        run: bash tools/lint_varsets.sh
