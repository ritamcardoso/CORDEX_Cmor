&cordex_config 
!
!  Date and  intial time
!
yeari   = _START_YY_
yearf   = _END_YY_
iniyear = 1950
nmonths = 12
imonth  = 1
iday    = 1
ihour   = 0
!
!   Grid spacing
!
nz      = 59
nsoil   = 4
nlon    = 236
nlat    = 252
xoffset = 10
yoffset = 10
p_top   = 2000.
!
! Location of the files 
! dir  - location of the WRF files
! dir2 - location of the output files
!
dir     = '_OUTPUT_WRF_'
dir2    = '_OUTPUT_DIR_'
!
geog    = 'geo_em.d02'
wrffile = '_WRFFILE_'
!
dom     = '2'
outdom  = '_PARIS-3_ERA5_evaluation_r1i1p1f1_IDL-FCUL_WRF451R-CTRL_v1-fpsurbrcc-s0r1_'
!
! Map projection of the output grid (CF grid_mapping_name):
! 'rotated_latitude_longitude' (pole_lat, pole_lon) or 'lambert_conformal_conic'
! (truelat1, truelat2, stand_lon, cen_lat; any left out are read from geo_em)
!
projection = 'lambert_conformal_conic'
!truelat1  = 30.
!truelat2  = 60.
!stand_lon = 10.
!cen_lat   = 50.
!
