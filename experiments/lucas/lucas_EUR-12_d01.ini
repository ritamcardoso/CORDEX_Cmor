&cordex_config 
!
!  Date and  intial time
!
yeari   = _START_YY_
yearf   = _END_YY_
iniyear = 1950
nmonths = 12
imonth  = 1
iday    = 1
ihour   = 0
!
!  Output step (hours) of the variables whose header has outstep = 0, those requested at a
!  different frequency by CORDEX-CMIP6 (6hr) and FPS-LUCAS (1hr): mrso, mrro, mrros, mrsol, tsl.
!  6 for CORDEX-CMIP6, 1 for FPS-LUCAS. The other variables have their step in the header.
!
wp_step = 1
!
!   Grid spacing
!
nz      = 53
nsoil   = 4
nlon    = 424
nlat    = 412
xoffset = 10
yoffset = 10
p_top   = 2000.
!
! Location of the files 
! dir_in  - location of the WRF files
! dir_out - location of the output files
!
dir_in  = '_OUTPUT_WRF_'
dir_out = '_OUTPUT_DIR_'
!
geog    = 'geo_em.d01'
wrffile = '_WRFFILE_'
!
dom     = '1'
outdom  = '_EUR-12_MPI-ESM1-2-HR_ssp370_r1i1p1f1_IDL-FCUL_WRF451Q_v1-r1_'
!
! Map projection of the output grid (CF grid_mapping_name):
! 'rotated_latitude_longitude' (pole_lat, pole_lon) or 'lambert_conformal_conic'
! (truelat1, truelat2, stand_lon, cen_lat; any left out are read from geo_em)
!
projection = 'rotated_latitude_longitude'
pole_lat   = 39.25
pole_lon   = -162.
!
